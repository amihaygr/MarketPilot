server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream backend-api:8000;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # The local dashboard is rebuilt frequently. Prevent a previous phase's
    # HTML, CSS, or JavaScript from surviving a container rebuild in the browser.
    location = /index.html {
        expires epoch;
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        expires epoch;
        try_files $uri =404;
    }

    location / {
        expires epoch;
        try_files $uri $uri/ /index.html;
    }
}
