# Docker assigns service IP addresses dynamically.  Resolve on each proxied
# request so the UI remains reachable after a Spark container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 18080;

    location / {
        set $spark_master_upstream spark-master:18080;
        proxy_pass http://$spark_master_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 18081;

    location / {
        set $spark_worker_upstream spark-worker:18081;
        proxy_pass http://$spark_worker_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
