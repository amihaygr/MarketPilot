name: ${COMPOSE_PROJECT_NAME:-marketpilot}

x-python-service: &python-service
  image: marketpilot-python:0.1.0
  env_file: .env
  restart: unless-stopped
  networks: [data-plane]

x-spark-image: &spark-image
  image: marketpilot-spark:3.5.8
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile.spark

x-airflow-common: &airflow-common
  image: marketpilot-airflow:3.0.3
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile.airflow
  env_file: .env
  environment:
    AIRFLOW__CORE__DEFAULT_TIMEZONE: ${AIRFLOW_TIMEZONE:-America/New_York}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__INTERNAL_API_SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/simple_auth_manager_passwords.json
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USERNAME}:admin
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./spark:/opt/marketpilot/spark:ro
    - ./src:/opt/marketpilot/src:ro
    - airflow-auth:/opt/airflow/auth
    - airflow-logs:/opt/airflow/logs

services:
  test-runner:
    profiles: [tools]
    image: marketpilot-test:0.1.0
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.test
    command: python -m pytest -q
    network_mode: none
    restart: "no"

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [data-plane]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    env_file: .env
    ports: ["127.0.0.1:9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [data-plane, serving-plane]

  mariadb:
    image: mariadb:11.4
    env_file: .env
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [data-plane, serving-plane]

  spark-master:
    <<: *spark-image
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_WEBUI_PORT: 18080
      SPARK_PUBLIC_DNS: localhost
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/spark-master/7077'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [data-plane]

  spark-worker:
    <<: *spark-image
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_WEBUI_PORT: 18081
      SPARK_PUBLIC_DNS: localhost
    volumes: [spark-checkpoints:/checkpoints]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/18081'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    depends_on:
      spark-master: {condition: service_healthy}
    networks: [data-plane]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: marketpilot-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports: ["127.0.0.1:8085:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    depends_on:
      kafka: {condition: service_healthy}
    networks: [data-plane, serving-plane]

  spark-ui-proxy:
    image: nginx:1.27.5-alpine
    ports:
      - "127.0.0.1:18080:18080"
      - "127.0.0.1:18081:18081"
    volumes:
      - ./infrastructure/nginx/spark-ui.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    depends_on:
      spark-master: {condition: service_healthy}
      spark-worker: {condition: service_healthy}
    networks: [data-plane, serving-plane]

  adminer:
    image: adminer:5.5.1-standalone
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    ports: ["127.0.0.1:8086:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    depends_on:
      mariadb: {condition: service_healthy}
    networks: [serving-plane]

  backend-api:
    image: marketpilot-backend-api:0.1.0
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      MARIADB_HOST: ${MARIADB_HOST:-mariadb}
      MARIADB_PORT: ${MARIADB_PORT:-3306}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-marketpilot}
      MARIADB_APP_USER: ${MARIADB_APP_USER}
      MARIADB_APP_PASSWORD: ${MARIADB_APP_PASSWORD}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
      API_MAX_MARKET_RANGE_DAYS: ${API_MAX_MARKET_RANGE_DAYS:-31}
      API_MAX_FILING_RANGE_DAYS: ${API_MAX_FILING_RANGE_DAYS:-3660}
      API_QUERY_TIMEOUT_SECONDS: ${API_QUERY_TIMEOUT_SECONDS:-10}
      MARKETPILOT_CODE_VERSION: ${MARKETPILOT_CODE_VERSION:-development}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5).read()
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on:
      mariadb: {condition: service_healthy}
    networks: [serving-plane]

  web-app:
    image: marketpilot-web-app:0.1.0
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    ports: ["127.0.0.1:3000:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    depends_on:
      backend-api: {condition: service_healthy}
    networks: [serving-plane]

  market-producer:
    <<: *python-service
    command: python -m services.market_producer.main
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'services.market_producer.main' /proc/1/cmdline"]
      interval: 15s
      timeout: 5s
      retries: 6
    stop_grace_period: 30s
    depends_on:
      platform-init: {condition: service_completed_successfully}
    networks: [data-plane, serving-plane]

  raw-archive-sink:
    <<: *python-service
    command: python -m services.raw_archive_sink.main
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'services.raw_archive_sink.main' /proc/1/cmdline"]
      interval: 15s
      timeout: 5s
      retries: 6
    depends_on:
      platform-init: {condition: service_completed_successfully}

  operational-monitor:
    <<: *python-service
    command: python -m services.operational_monitor.main
    environment:
      MINIO_ARCHIVE_BUCKET: ${MINIO_ARCHIVE_BUCKET:-marketpilot-archive}
      OPERATIONS_CHECK_INTERVAL_SECONDS: ${OPERATIONS_CHECK_INTERVAL_SECONDS:-60}
      OPERATIONS_MARKET_FRESHNESS_MAX_HOURS: ${OPERATIONS_MARKET_FRESHNESS_MAX_HOURS:-96}
      OPERATIONS_SEC_FRESHNESS_MAX_HOURS: ${OPERATIONS_SEC_FRESHNESS_MAX_HOURS:-336}
      OPERATIONS_ALERT_WEBHOOK_URL: ${OPERATIONS_ALERT_WEBHOOK_URL:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,time;
          path='/tmp/operational-monitor-ready';
          assert os.path.exists(path) and time.time()-os.path.getmtime(path)<180
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    depends_on:
      platform-init: {condition: service_completed_successfully}
      backend-api: {condition: service_healthy}
    networks: [data-plane, serving-plane]

  sec-adapter:
    <<: *python-service
    profiles: [jobs]
    command: python -m marketpilot.sec.polling
    restart: "no"
    depends_on:
      platform-init: {condition: service_completed_successfully}
      mariadb: {condition: service_healthy}
    networks: [data-plane, serving-plane]

  platform-init:
    <<: *python-service
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.python
    command: python -m services.platform_init.main
    environment:
      MINIO_ANALYTICS_BUCKET: ${MINIO_ANALYTICS_BUCKET:-marketpilot-analytics}
    restart: "no"
    depends_on:
      kafka: {condition: service_healthy}
      minio: {condition: service_healthy}

  spark-streaming:
    <<: *spark-image
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.cores.max=2
      - --conf
      - spark.executor.cores=2
      - --conf
      - spark.executor.memory=768m
      - /opt/marketpilot/spark/jobs/stream_market_bars.py
    env_file: .env
    environment:
      SPARK_CHECKPOINT_PATH: ${SPARK_CHECKPOINT_PATH:-/checkpoints/market-bars-v2}
    restart: unless-stopped
    volumes: [./spark:/opt/marketpilot/spark:ro, spark-checkpoints:/checkpoints]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/streaming-ready"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    stop_grace_period: 45s
    depends_on:
      platform-init: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
      mariadb: {condition: service_healthy}
      spark-master: {condition: service_healthy}
      spark-worker: {condition: service_healthy}
    networks: [data-plane]

  spark-batch:
    <<: *spark-image
    profiles: [batch]
    env_file: .env
    command: ["/bin/true"]
    restart: "no"
    volumes:
      - ./spark:/opt/marketpilot/spark:ro
      - ./src:/opt/marketpilot/src:ro
    depends_on:
      platform-init: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
      mariadb: {condition: service_healthy}
      spark-master: {condition: service_healthy}
      spark-worker: {condition: service_healthy}
    networks: [data-plane]

  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes: [airflow-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [control-plane]

  airflow-scheduler:
    <<: *airflow-common
    hostname: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      airflow-dag-processor: {condition: service_started}
      minio: {condition: service_healthy}
      mariadb: {condition: service_healthy}
      spark-master: {condition: service_healthy}
      spark-worker: {condition: service_healthy}
    networks: [control-plane, data-plane, serving-plane]

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname $${HOSTNAME}"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    networks: [control-plane]

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/v2/monitor/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      airflow-dag-processor: {condition: service_started}
    networks: [control-plane, serving-plane]

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    command:
      - bash
      - -c
      - >-
        chown -R airflow:root /opt/airflow/auth /opt/airflow/logs &&
        runuser -u airflow -- airflow db migrate &&
        runuser -u airflow -- airflow pools set spark_batch_pool 1
        "Serialize local Spark Batch work" &&
        runuser -u airflow -- airflow pools set sec_api_pool 1
        "Serialize SEC API access below the shared rate limit" &&
        runuser -u airflow -- airflow pools set alpaca_api_pool 1
        "Serialize bounded Alpaca historical API access" &&
        (runuser -u airflow -- airflow connections delete spark_standalone || true) &&
        runuser -u airflow -- airflow connections add spark_standalone
        --conn-type spark --conn-host "spark://spark-master" --conn-port 7077
        --conn-extra '{"deploy-mode":"client","spark_binary":"spark-submit"}' &&
        runuser -u airflow -- python -c 'import json, os; from pathlib import Path;
        Path("/opt/airflow/auth/simple_auth_manager_passwords.json").write_text(
        json.dumps({os.environ["AIRFLOW_ADMIN_USERNAME"]:
        os.environ["AIRFLOW_ADMIN_PASSWORD"]}) + "\n", encoding="utf-8")'
    restart: "no"
    depends_on:
      airflow-db: {condition: service_healthy}
    networks: [control-plane]

networks:
  data-plane: {internal: true}
  control-plane: {internal: true}
  serving-plane: {}

volumes:
  kafka-data: {}
  minio-data: {}
  mariadb-data: {}
  spark-checkpoints: {}
  airflow-db-data: {}
  airflow-auth: {}
  airflow-logs: {}
