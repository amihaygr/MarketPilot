[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "marketpilot"
version = "0.1.0"
description = "Local Docker-based market data engineering platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35",
  "confluent-kafka>=2.6",
  "exchange-calendars>=4.13,<5",
  "PyMySQL>=1.1,<2",
]

[project.optional-dependencies]
external = [
  "alpaca-py>=0.42",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marketpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]
markers = ["integration: requires local infrastructure"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
